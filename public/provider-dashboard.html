<!DOCTYPE html>
<html>
<head>
    <title>Provider Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: auto; }
        header { background: #4a6fa5; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #e0e0e0; border: none; border-radius: 5px; cursor: pointer; }
        .tab.active { background: #4a6fa5; color: white; }
        .content { display: none; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #f5f5f5; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; }
        button { padding: 10px 20px; background: #4a6fa5; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .logout { background: #e74c3c; float: right; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Provider Dashboard</h1>
            <button class="logout" onclick="logout()">Logout</button>
            <p id="provider-info">Welcome</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('appointments')">Appointments</button>
            <button class="tab" onclick="switchTab('services')">Services</button>
            <button class="tab" onclick="switchTab('add-slot')">Add Time Slot</button>
        </div>

        <div id="appointments" class="content active">
            <h2>Appointments</h2>
            <div id="appointments-list">Loading...</div>
        </div>

        <div id="services" class="content">
            <h2>Services</h2>
            <button onclick="addService()">Add Service</button>
            <div id="services-list">Loading...</div>
        </div>

        <div id="add-slot" class="content">
            <h2>Add Time Slot</h2>
            <form id="add-slot-form">
                <div class="form-group">
                    <label>Service:</label>
                    <select id="service-select" required>
                        <option value="">Loading...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date:</label>
                    <input type="date" id="slot-date" required>
                </div>
                <div class="form-group">
                    <label>Start Time:</label>
                    <input type="time" id="start-time" required>
                </div>
                <div class="form-group">
                    <label>End Time:</label>
                    <input type="time" id="end-time" required>
                </div>
                <button type="submit">Add Slot</button>
            </form>
        </div>
    </div>

    <script>
        let token = '';
        let userId = '';

        window.onload = function() {
            token = localStorage.getItem('providerToken');
            if (!token) {
                alert('Please login first');
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const parts = token.split('.');
                const payload = JSON.parse(atob(parts[1]));
                userId = payload.userId;
                document.getElementById('provider-info').textContent = 'Welcome, User ID: ' + userId;
            } catch (e) {
                console.log('Token error:', e);
            }
            
            loadData();
        };

        function loadData() {
            loadServices();
            loadAppointments();
        }

        function loadServices() {
            fetch('/api/services/provider', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    displayServices(data.services);
                    populateServiceSelect(data.services);
                }
            })
            .catch(err => {
                console.log('Error loading services:', err);
                if (err.message.includes('401')) {
                    localStorage.removeItem('providerToken');
                    window.location.href = '/login.html';
                }
            });
        }

        function loadAppointments() {
            fetch('/api/bookings/provider-appointments', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    displayAppointments(data.appointments);
                }
            })
            .catch(err => console.log('Error loading appointments:', err));
        }

        function displayAppointments(appointments) {
            const container = document.getElementById('appointments-list');
            if (!appointments || appointments.length === 0) {
                container.innerHTML = '<p>No appointments</p>';
                return;
            }
            
            let html = '<table><tr><th>Customer</th><th>Service</th><th>Date</th><th>Time</th></tr>';
            appointments.forEach(apt => {
                html += '<tr>';
                html += '<td>' + (apt.customer_name || 'N/A') + '</td>';
                html += '<td>' + (apt.service_name || 'N/A') + '</td>';
                html += '<td>' + (apt.booking_date ? new Date(apt.booking_date).toLocaleDateString() : 'N/A') + '</td>';
                html += '<td>' + (apt.starttime || 'N/A') + ' - ' + (apt.endtime || 'N/A') + '</td>';
                html += '</tr>';
            });
            html += '</table>';
            container.innerHTML = html;
        }

        function displayServices(services) {
            const container = document.getElementById('services-list');
            if (!services || services.length === 0) {
                container.innerHTML = '<p>No services yet</p>';
                return;
            }

            let html = '<table><tr><th>Name</th><th>Description</th><th>Price</th><th>Actions</th></tr>';
            services.forEach(service => {
                html += '<tr>';
                html += '<td>' + service.name + '</td>';
                html += '<td>' + service.description + '</td>';
                html += '<td>$' + service.price + '</td>';
                html += '<td>' +
                            '<button onclick="editService(' + service.serviceid + ')">Edit</button> ' +
                            '<button onclick="deleteService(' + service.serviceid + ')">Delete</button>' +
                        '</td>';
                html += '</tr>';
            });
            html += '</table>';
            container.innerHTML = html;
        }

        function populateServiceSelect(services) {
            const select = document.getElementById('service-select');
            select.innerHTML = '';
            if (!services || services.length === 0) {
                select.innerHTML = '<option value="">No services</option>';
                return;
            }
            services.forEach(service => {
                const option = document.createElement('option');
                option.value = service.serviceid;
                option.textContent = service.name + ' ($' + service.price + ')';
                select.appendChild(option);
            });
        }

        function addService() {
            const name = prompt('Service name:');
            if (!name) return;
            
            const desc = prompt('Description:');
            if (!desc) return;
            
            const price = prompt('Price:');
            if (!price) return;
            
            const duration = prompt('Duration (minutes):');
            if (!duration) return;
            
            fetch('/api/services', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    name: name,
                    description: desc,
                    price: parseFloat(price),
                    duration: parseInt(duration)
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.success ? 'Service added!' : 'Error: ' + data.message);
                if (data.success) loadServices();
            })
            .catch(err => alert('Error: ' + err.message));
        }

        function editService(serviceId) {
            const name = prompt('New service name:');
            if (!name) return;

            const desc = prompt('New description:');
            if (!desc) return;

            const price = prompt('New price:');
            if (!price) return;

            const duration = prompt('New duration (minutes):');
            if (!duration) return;

            fetch(`/api/services/${serviceId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    name: name,
                    description: desc,
                    price: parseFloat(price),
                    duration: parseInt(duration)
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.success ? 'Service updated!' : 'Error: ' + data.message);
                if (data.success) loadServices();
            })
            .catch(err => alert('Error: ' + err.message));
        }

        function deleteService(serviceId) {
            if (!confirm('Are you sure you want to delete this service?')) return;

            fetch(`/api/services/${serviceId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(data => {
                alert(data.success ? 'Service deleted!' : 'Error: ' + data.message);
                if (data.success) loadServices();
            })
            .catch(err => alert('Error: ' + err.message));
        }

        document.getElementById('add-slot-form').onsubmit = function(e) {
            e.preventDefault();
            const serviceId = document.getElementById('service-select').value;
            const date = document.getElementById('slot-date').value;
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            
            if (!serviceId || !date || !startTime || !endTime) {
                alert('All fields required');
                return;
            }
            
            fetch('/api/availability', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    service_id: parseInt(serviceId),
                    date: date,
                    start_time: startTime,
                    end_time: endTime
                })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.success ? 'Slot added!' : 'Error: ' + data.message);
                if (data.success) {
                    document.getElementById('add-slot-form').reset();
                }
            })
            .catch(err => alert('Error: ' + err.message));
        };

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        function logout() {
            localStorage.removeItem('providerToken');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
